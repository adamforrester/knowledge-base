name: vault-check

# The five mechanical vault checks from issue #75. See scripts/vault-check.py.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  vault-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # The runner's own python3 is enough: the script is standard library only.
      - run: python3 scripts/vault-check.py
